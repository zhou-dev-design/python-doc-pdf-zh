name: 构建 Python 中文文档 PDF（Linux）

# ★ 这是仓库里**唯一**的流水线（Windows 那条已于 2026-11-02 删除）。
#   仓库是公开的 ⇒ Actions 分钟数不限，每天跑五个版本也没有额度问题。
on:
  # ★ 触发时刻：UTC 00:47 = 北京 08:47，**实际出稿在下午 16:30 前后**。
  #
  #   GitHub 的定时只是"尽力而为"，本仓库实测有一个固定偏移约 7h45m：
  #     cron 04:00 → 实际 11:46:48（+7h46m）；cron 03:47 → 11:36:48 / 11:30:20（+7h49 / +7h43）
  #   偏移跟着 cron 平移（cron 早 13 分钟，启动也早 10 分钟），所以把 cron 提前 3 小时，
  #   出稿就从 19:30 挪到 16:30 左右。
  #
  #   ★★ 为什么是 00:47、不能再早：构建根名与 release 标题里的日期取的是 UTC 日期
  #   （主程序 time.strftime("%Y%m%d")）。启动一旦落在 UTC 16:00–24:00（北京 00–08 点），
  #   文件名就会与北京日期差一天。00:47 是"即使排队延迟变成 0 也不跨天"的最早时刻
  #   （启动必然 ≥ 00:00 UTC）；要在这个时刻踩坑，延迟得涨到 15h13m 以上。
  #   分钟取 47 则是避开整点洪峰（:00 最挤，:42~:52 实测只剩 1.6 / 0.2 分钟）。
  #
  #   要立刻出稿：用 workflow_dispatch（同参数、同结果，只是不走 cron 队列）。
  schedule:
    - cron: "47 0 * * *"        # UTC 00:47 = 北京 08:47（实际约 16:30 出稿）
  workflow_dispatch:
    inputs:
      versions:
        description: "要构建的版本，逗号分隔（3.11~3.15 五个版本；3.10 已于 2026-10-31 EOL，不再构建）"
        default: "3.11,3.12,3.13,3.14,3.15"
      jobs:
        description: "并发数：步骤 6 的 sphinx -j 与步骤 7 的册级并发共用"
        default: "4"
      merge:
        description: "是否生成合并册（步骤 9）"
        type: choice
        options: ["true", "false"]
        default: "true"
      clean:
        description: "步骤 10 清理范围（默认 none：留着日志，验收报告的「每步耗时」和排错都要它）"
        type: choice
        options: ["none", "build", "all"]
        default: "none"
      push_branch:
        description: "构建成功后发布到 Releases（同版本原地更新，旧补丁版归档到 old 分支）"
        type: choice
        options: ["true", "false"]
        default: "true"
      archive_only:
        description: "只做归档（把 EOL 版本的 release 挪进 old 分支），不构建 —— 勾 true 时跳过所有 build"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: write               # 要往仓库推分支

concurrency:
  group: build-pdf-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 拆版本 + 刷新版本号
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      versions: ${{ steps.m.outputs.versions }}
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: m
        name: 解析版本列表 → matrix
        env:
          # 定时触发时没有 inputs（为空）→ 用下面的五版本默认值；手动触发则按填的来。
          VERSIONS: ${{ github.event.inputs.versions }}
        run: |
          python3 - <<'PY'
          import json, os
          # ★ 3.10 已于 2026-10-31 EOL：不再构建，它的 release 由 archive-eol 归档到 old 分支
          DEFAULT = ["3.11", "3.12", "3.13", "3.14", "3.15"]
          raw = os.environ.get("VERSIONS") or ""
          vs = [v.strip() for v in raw.split(",") if v.strip()]
          if not vs:
              vs = DEFAULT
          m = json.dumps({"version": vs})
          print("matrix =", m)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("matrix=" + m + "\n")
              f.write("versions=" + ",".join(vs) + "\n")
          PY

      # ★★ 每次构建都对着官方文档站核一遍版本号，变了就提交 ★★
      #   为什么必须"每次"、而且必须真的写回仓库：
      #     完整版本号（→ 构建根名 → release 的 tag）的唯一口径是官方文档站标题
      #     `docs.python.org/zh-cn/3.1X/` 的 h1。缓存停在 3.15.2、而上游已经发了
      #     3.15.3 时，构建出来的 TAG 还是 v3.15.2 —— 于是
      #       ① 不会产生新 tag，旧 release 也就**不会**被归档到 old；
      #       ② 新内容被原地覆盖成旧名字（内容新、文件名旧，且不报任何错）。
      #     所以这一步不是"复核提醒"，而是**必须做成功的前置动作**。
      - name: 刷新版本号缓存（对着官方文档站，变了就提交）
        env:
          VERSIONS: ${{ steps.m.outputs.versions }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 返回码：0 全部成功 / 1 官方标题与请求的版本线对不上（严重）/
          #         2 有版本取不到（网络）。--write 走的是**合并写回**，
          #         所以 rc=2 时取到的那几个仍然有效，可以照常提交。
          python3 sphinx-pdf/gui/pdf_builder_multi.py --tool titles --write \
            --versions "$VERSIONS"
          rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::官方文档站返回的标题与请求的版本线对不上 —— 中止，绝不用错版本号命名"
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::warning::有版本取不到（网络）—— 取到的那几个仍然会更新并提交"
          fi
          if git diff --quiet -- sphinx-pdf/version-titles.json; then
            echo "版本号无变化（缓存已是最新）"; exit 0
          fi
          echo "版本号有变化："
          git diff --unified=0 -- sphinx-pdf/version-titles.json | grep -E '^[+-] ' || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sphinx-pdf/version-titles.json
          git commit -q -m "chore(titles): 官方文档站版本号更新（$(date -u '+%Y-%m-%d') UTC）"
          for i in 1 2 3; do
            if git push -q \
                 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                 HEAD:main; then
              echo "✔ 已提交并推送到 main（后续 job 会拉到新值）"
              exit 0
            fi
            echo "推送冲突，第 $i 次重试"
            git pull -q --rebase --autostash \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main || true
            sleep 3
          done
          echo "::warning::version-titles.json 推送失败 —— 本轮命名会用旧版本号，\
          旧 release 也就不会归档；下一轮会重试"

  # ---------------------------------------------------------------- 归档 EOL
  # ★ 停止支持的版本：把 release 里的附件挪进 old 分支的 <tag>/ 目录，然后删掉
  #   release（--cleanup-tag 连 tag 一起清）。与发布步骤里「补丁版升级时归档上一版」
  #   是同一套做法，只是这里的触发条件是「版本线 EOL」而不是「出了新补丁版」。
  #   幂等：release 已经不在了就跳过，所以每次运行都能无条件跑一遍。
  #   加一个版本：往 EOL_TAGS 里添一个 tag 即可。
  archive-eol:
    needs: prepare
    runs-on: ubuntu-22.04
    continue-on-error: true          # 归档失败不该拦住建 PDF
    steps:
      - name: 把停止支持的版本归档到 old 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # ── 停止支持的版本清单（tag）────────────────────────────────
          #   3.10.22：Python 3.10 于 2026-10-31 EOL（官方停止安全更新）
          EOL_TAGS="v3.10.22"
          # ────────────────────────────────────────────────────────
          # ★ gh 必须显式带 -R：这个 job 没有 actions/checkout，工作目录不是 git
          #   仓库 —— 不加 -R 时 `gh release view` 会报 "not a git repository" 并返回
          #   非 0，看起来跟「release 不存在」一模一样（2026-11-03 就这么静默跳过了）。
          echo "repo=$GITHUB_REPOSITORY"
          TODO=()
          for t in $EOL_TAGS; do
            if gh release view "$t" -R "$GITHUB_REPOSITORY" >/dev/null 2>"$RUNNER_TEMP/gh-err.txt"; then
              TODO+=( "$t" )
            else
              echo "$t 查不到 —— 跳过（gh 原话：$(head -3 "$RUNNER_TEMP/gh-err.txt" | tr '\n' ' ')）"
            fi
          done
          [ "${#TODO[@]}" -gt 0 ] || { echo "没有需要归档的版本"; exit 0; }
          echo "要归档：${TODO[*]}"

          W="$RUNNER_TEMP/oldrepo"
          rm -rf "$W"
          if ! git clone -q --depth 1 --branch old \
               "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$W" 2>/dev/null; then
            mkdir -p "$W"; git -C "$W" init -q; git -C "$W" checkout -q -b old
          fi
          git -C "$W" config user.name  "github-actions[bot]"
          git -C "$W" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GOT=()
          for t in "${TODO[@]}"; do
            D="$RUNNER_TEMP/eol-$t"; rm -rf "$D"; mkdir -p "$D"
            if gh release download "$t" -R "$GITHUB_REPOSITORY" --dir "$D" --clobber \
               && [ -n "$(ls -A "$D" 2>/dev/null)" ]; then
              mkdir -p "$W/$t"; cp -f "$D"/* "$W/$t"/
              GOT+=( "$t" )
              echo "  已下载 $t（$(du -sh "$D" | cut -f1)）"
            else
              echo "::error::$t 下载失败或没有附件 —— 不删它的 release（下轮再试）"
            fi
          done
          [ "${#GOT[@]}" -gt 0 ] || exit 0

          git -C "$W" add -A
          git -C "$W" commit -q -m "old: 归档 EOL ${GOT[*]}（$(date -u '+%Y-%m-%d %H:%M') UTC）" || true
          PUSHED=0
          for i in 1 2 3; do
            if git -C "$W" push -q \
                 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                 HEAD:refs/heads/old; then PUSHED=1; break; fi
            echo "  old 分支推送冲突，第 $i 次重试"
            git -C "$W" pull -q --rebase --autostash \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" old || true
            sleep 5
          done
          if [ "$PUSHED" -eq 1 ]; then
            for t in "${GOT[@]}"; do
              gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag \
                && echo "  已删除 release $t（内容在 old 分支 $t/ 下）"
            done
          else
            echo "::error::old 分支推送失败，EOL 的 release 先留着（下轮再归档）"
            exit 1
          fi

  # ---------------------------------------------------------------- 构建
  build:
    needs: prepare
    # 手动触发时勾了「只做归档」就跳过构建（定时触发没有这个 input，永远构建）
    if: github.event.inputs.archive_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # ★ 五个版本（3.11~3.15）全部同时起跑：每个 job 一个独立 runner，
      #   互不干扰；公开仓库 Actions 分钟数不限，唯一的瓶颈是并发额度
      #   （免费/公开仓库通常允许 20 个，五个远够）。3.10 已 EOL，不再构建。
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: build ${{ matrix.version }}
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          # ★ 必须显式 ref + 拉最新：默认 checkout 的是**触发时的 sha**，
          #   而 prepare 可能刚刚往 main 推了新的 version-titles.json。
          #   不拿最新的话，这里读到的还是旧版本号 → TAG 旧 → 不归档且覆盖旧 release。
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: 恢复 apt 缓存（省掉每轮约 250 MB 下载）
        # ★ 为什么需要：runner 每次都是全新机器，TeX Live + 字体约 250 MB / 41 个包，
        #   实测有一轮光下载就花了 9 分钟（fonts-noto-cjk 单个 61 MB，带宽只有几百 KB/s）。
        #   把 .deb 缓存起来，命中后 apt 直接从本地装，不用再下。
        #   key 里带 workflow 的哈希：改了包列表就自动换一份缓存。
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build-pdf-linux.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: 装系统依赖（TeX Live + 字体 + poppler + cairo）
        run: |
          set -x
          # 1) 把上次缓存的 .deb 放回 apt 的归档目录（命中时 apt 会直接跳过下载）
          mkdir -p "$HOME/apt-cache"
          sudo mkdir -p /var/cache/apt/archives/partial
          if ls "$HOME"/apt-cache/*.deb >/dev/null 2>&1; then
            n=$(ls "$HOME"/apt-cache/*.deb | wc -l)
            echo "命中 apt 缓存：$n 个 .deb"
            sudo cp -n "$HOME"/apt-cache/*.deb /var/cache/apt/archives/ || true
          else
            echo "首次运行，没有 apt 缓存（这一轮会比较慢，下一轮起就快了）"
          fi
          # 2) 抓索引（带重试）
          sudo apt-get update -o Acquire::Retries=3 \
            || { echo "apt-get update 失败，5 秒后重试"; sleep 5; sudo apt-get update -o Acquire::Retries=3; }
          # 字体包：项目自己的日志检查里出现过 `... in font [FreeSansBold.otf]` 的字形告警，
          # 说明文档链上会用到 FreeSerif/FreeSans/FreeMono 这几族；Ubuntu 镜像默认不装，先备着。
          # ⚠️ 但 2026-11-02 实测：装上这些字体之后，xelatex 的 nullfont 警告**依旧出现**，
          #   所以「缺字体」不是那次失败的根因（真正原因见 canary 步骤的结论）。
          PKGS="git curl ca-certificates latexmk texlive-xetex texlive-latex-extra texlive-binaries texlive-fonts-recommended texlive-lang-chinese lmodern fonts-freefont-otf fonts-dejavu fonts-liberation fonts-texgyre fonts-noto-cjk poppler-utils libcairo2"
          # ★ 硬超时 + 单连接超时：
          #   apt 默认**没有**下载超时，镜像限速/卡住时会无限等（实测卡在 61 MB 的
          #   fonts-noto-cjk 上 9 分钟不动，最后只能手动取消整个 job）。
          #   这里给整步 900 秒、单连接 30 秒的硬上限：宁可失败重跑，也不要干等。
          APTOPTS="-o Acquire::Retries=3 -o Acquire::http::Pipeline-Depth=10 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          if ! timeout 900 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $APTOPTS $PKGS; then
            # 一次性装失败时逐包重试：这样日志里能直接看出是哪个包的问题
            echo "::error::批量安装失败或超时，改为逐包定位（每个包 300 秒上限）"
            for p in $PKGS; do
              timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $APTOPTS "$p" \
                || echo "::warning::包 $p 装不上（或超时）"
            done
          fi
          # 3) 把这一轮下到的 .deb 存进缓存目录，下一轮直接用
          sudo cp -n /var/cache/apt/archives/*.deb "$HOME/apt-cache/" 2>/dev/null || true
          echo "本次缓存的 .deb：$(ls "$HOME"/apt-cache/*.deb 2>/dev/null | wc -l) 个，共 $(du -sh "$HOME/apt-cache" 2>/dev/null | cut -f1)"
          echo "--- 关键工具 ---"
          for t in latexmk xelatex makeindex pdfinfo pdffonts git fc-list; do
            printf '%-10s %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
          echo "--- 主题要用的字体在不在（缺一个就会 nullfont）---"
          for f in "FreeSerif" "FreeSans" "FreeMono" "DejaVu Sans" "DejaVu Serif" \
                   "Noto Serif CJK SC" "Noto Sans CJK SC" "Latin Modern Roman"; do
            n="$(fc-list "$f" 2>/dev/null | wc -l || true)"
            if [ "$n" -gt 0 ]; then
              printf '%-22s OK (%s)\n' "$f" "$n"
            else
              printf '%-22s MISSING\n' "$f"
            fi
          done

      # ★ 发布时要打 RAR 包。Ubuntu 的 `rar` 在 multiverse 里（RARLAB 免费 CLI 版，
      #   压缩包注释里会带一行「evaluation copy」，不影响使用）。
      #   单独一步、装不上只警告：RAR 是**附加**产物，不能因为它挡掉整个发布。
      - name: 装 rar（打压缩包用；失败只警告，不影响 PDF）
        continue-on-error: true
        run: |
          set +e
          if command -v rar >/dev/null 2>&1; then rar 2>/dev/null | head -2; exit 0; fi
          sudo add-apt-repository -y multiverse >/dev/null 2>&1
          sudo apt-get update -qq -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          timeout 240 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rar
          command -v rar >/dev/null 2>&1 \
            && rar 2>/dev/null | head -2 \
            || echo "::warning::装不上 rar —— 发布时会跳过 RAR 包（PDF 照发）"

      - name: canary：xelatex 中文/字体冒烟（5 秒，失败不算作业失败）
        # ★ 为什么要这一段：完整构建要 15 分钟，而「latexmk 退出码 12、每册 1.5 秒、
        #   只有 1 页」这种失败，根因往往就是 xelatex 连第一页都排不出来。
        #   这里用两个 6 行的最小文档把「xeCJK 有没有 CJK 字体」「FreeSerif/Sans/Mono
        #   在不在」分别验一遍，几秒钟就能定位，不用等一整轮。
        continue-on-error: true
        run: |
          set +e
          cd "$RUNNER_TEMP"
          echo "=== kpsewhich（CJK 宏包是否存在）==="
          for f in xeCJK.sty ctex.sty fandol.sty fontspec.sty sphinx.sty; do
            printf '%-14s %s\n' "$f" "$(kpsewhich "$f" || echo MISSING)"
          done
          echo "=== fc-match（fontconfig 实际会选哪个文件）==="
          for f in "FreeSerif" "FreeSans" "FreeMono" "Noto Serif CJK SC"; do
            printf '%-20s %s\n' "$f" "$(fc-match -f '%{family}|%{file}' "$f")"
          done

          echo "=== canary 1：xeCJK 排中文 ==="
          cat > canary-cjk.tex <<'TEX'
          \documentclass{article}
          \usepackage{xeCJK}
          \begin{document}
          中文测试 Hello
          \end{document}
          TEX
          xelatex -interaction=nonstopmode -halt-on-error canary-cjk.tex > canary-cjk.log 2>&1
          echo "退出码: $?"
          grep -nE '^! |Missing character|not a native platform|Font .* does not' canary-cjk.log | head -10

          echo "=== canary 2：FreeSerif / FreeSans / FreeMono ==="
          cat > canary-free.tex <<'TEX'
          \documentclass{article}
          \usepackage{fontspec}
          \setmainfont{FreeSerif}
          \setsansfont{FreeSans}
          \setmonofont{FreeMono}
          \begin{document}
          Hello \textsf{World} \texttt{code}
          \end{document}
          TEX
          xelatex -interaction=nonstopmode -halt-on-error canary-free.tex > canary-free.log 2>&1
          echo "退出码: $?"
          grep -nE '^! |Font .* does not|not a native platform' canary-free.log | head -10

          echo "=== 结论判据 ==="
          echo "  两个 canary 都是 0 → 环境没问题，失败在 .tex 内容/宏包组合上"
          echo "  任一个非 0 → 就是它，看上面那几行 ! 开头的错误"

      - name: 装这个版本要用的 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          # ★ check-latest：不加这个会优先用 runner 预装的旧补丁版
          #   （实测拿到 3.15.1，而最新是 3.15.2，产物名也就跟着写错）。
          check-latest: true

      - name: 体检（不联网，先确认这台机器能跑）
        run: |
          PY="$(python -c 'import sys;print(sys.executable)')"
          python ci/linux/pdf_builder_linux.py --preflight \
            --versions "${{ matrix.version }}" \
            --python-map "${{ matrix.version }}=$PY"

      - name: 逻辑自检（平台胶水层，不联网）
        run: python ci/linux/selftest.py

      # ★ 命名口径自检：文件名里的完整版本号取自**官方文档站标题**
      #   （docs.python.org/zh-cn/3.13/ 的 h1 = `Python 3.13.18 文档`），
      #   缓存在 sphinx-pdf/version-titles.json。文档站一发新版，这一步就会
      #   打出「缓存是 3.13.18 → 需更新」，提醒我们跑 `--tool titles --write`。
      #   取不到网络只警告：命名继续用缓存，绝不因此挡掉整轮构建。
      # ★ 复核（不是"提醒"）：prepare 已经把官方标题写进 version-titles.json 并提交，
      #   这里再对着官方核一次。**不一致就是硬失败** —— 说明 prepare 的推送没成功，
      #   继续跑只会用旧版本号覆盖旧 release（内容新、名字旧，且不报错）。
      #   只有「官方站点取不到」（rc=2）才降级为警告，那是网络问题，不是配置问题。
      - name: 版本号口径复核（与官方不一致 = 失败）
        run: |
          set +e
          python sphinx-pdf/gui/pdf_builder_multi.py --tool titles \
            --versions "${{ matrix.version }}"
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::官方文档站取不到 —— 本轮沿用缓存里的版本号"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::version-titles.json 与官方文档站不一致（prepare 的刷新/推送可能失败）—— \
            继续跑会用旧 TAG 覆盖旧 release，故中止"
            exit 1
          fi

      - name: 分册清单自检（不联网，核对每版册数与合并册大纲）
        run: |
          python sphinx-pdf/gui/pdf_builder_multi.py --tool name-map --check
          python sphinx-pdf/gui/pdf_builder_multi.py --tool volumes \
            --versions "${{ matrix.version }}"

      - name: 构建 Python ${{ matrix.version }}
        id: build
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          PY="$(python -c 'import sys;print(sys.executable)')"
          BASE="$RUNNER_TEMP/build"
          mkdir -p "$BASE"
          MERGE_FLAG=""
          if [ "${{ github.event.inputs.merge }}" = "false" ]; then MERGE_FLAG="--no-merge"; fi
          python ci/linux/pdf_builder_linux.py \
            --versions "${{ matrix.version }}" \
            --base "$BASE" \
            --jobs "${{ github.event.inputs.jobs || '4' }}" \
            --clean "${{ github.event.inputs.clean || 'none' }}" \
            --source github \
            --pip-index "https://pypi.org/simple" \
            --python-map "${{ matrix.version }}=$PY" \
            $MERGE_FLAG
          # ★ 用 find 而不是 ls：构建根名字里有空格和中文，ls 在 set -e 下会误杀
          ROOT="$(find "$BASE" -maxdepth 1 -type d -name 'Python * PDF 文档 *' | sort | tail -1)"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "=== 产物（$ROOT）==="
          ls -la "$ROOT" | head -20

      # ★★ 2026-11-02 新增：上一轮「.log 里没有任何 ! 」+「每册 PDF 只有 1 页」+
      #   「ind=0」三条互相矛盾 —— 光 grep `^! ` 定不了位。这一段专门只回答一个问题：
      #   **一册到底死在哪儿**。判据从上到下越来越硬：
      #     ① .tex 体积    → 极小 = 步骤 6 只写了个壳（那就不是 xelatex 的锅）
      #     ② .log 尾部    → xelatex 最后一句是什么（`No pages of output` / 半行截断 = 进程被杀）
      #     ③ latexmk 原话 → 它是「第 1 遍就失败」还是「第 1 遍成功、makeindex 卡住」
      #     ④ 手工复跑     → 绕过 latexmk，直接看 xelatex 的退出码与真话
      - name: 🔬 显微镜：一册到底怎么死的（.tex 体积 / .log 尾部 / latexmk 原话 / 手工复跑）
        if: failure()
        run: |
          # ★ 把输出同时落一份到 $RUNNER_TEMP/probe.txt：后面那步会把它推到 ci-logs
          #   分支 —— 公开仓库的 Actions 日志仍然要鉴权才能读，落到分支里才读得到。
          exec > >(tee -a "$RUNNER_TEMP/probe.txt") 2>&1
          set +e
          ROOT="$(find "$RUNNER_TEMP/build" -maxdepth 1 -type d -name 'Python * PDF 文档 *' | sort | tail -1)"
          LATEX="$ROOT/cpython/Doc/build/latex"
          echo "ROOT=$ROOT"
          if [ ! -d "$LATEX" ]; then echo "(没有 build/latex —— 步骤 6 就没产出，跳过显微镜)"; exit 0; fi

          echo "=== 工具版本（TeX Live 年份很关键：apt 里的是老版）==="
          xelatex --version 2>&1 | head -2
          latexmk -v 2>&1 | head -2
          echo "xelatex 路径: $(command -v xelatex)"
          echo "makeindex 路径: $(command -v makeindex)"

          echo
          echo "=== ① .tex 体积：最小 3 册 / 最大 3 册 ==="
          echo "   （判据：1 页的册子如果 .tex 只有几 KB，说明步骤 6 只写了壳，不是编译问题）"
          # ★ 路径里有空格（Python 3.15.2 PDF 文档 …），不能用 `ls | xargs wc -c`
          #   —— 会被拆成 4 个不存在的文件名（第一版就踩了）。改成 while read。
          { ls -S "$LATEX"/*.tex 2>/dev/null | tail -3
            ls -S "$LATEX"/*.tex 2>/dev/null | head -3; } \
            | while IFS= read -r f; do wc -c "$f"; done
          echo "   .tex 总数: $(ls "$LATEX"/*.tex 2>/dev/null | wc -l)"
          echo "=== ①b 索引修复脚本（2026-11-02 的真根因就在这一行）==="
          head -8 "$LATEX/makeindex-fix.py" 2>/dev/null
          grep -n "CREATE_NO_WINDOW" "$LATEX/makeindex-fix.py" 2>/dev/null | head -4

          echo
          echo "=== ② 每册 .log 行数 / '!' 行数 / PDF 页数（按 ! 行数降序）==="
          for f in "$LATEX"/*.log; do
            [ -f "$f" ] || continue
            b="$(basename "$f")"; b="${b%.log}"
            lines="$(wc -l <"$f")"
            bangs="$(grep -c '^!' "$f")"
            pages="$(pdfinfo "$LATEX/$b.pdf" 2>/dev/null | awk '/^Pages:/{print $2}')"
            printf '%8s %4s %6s  %s\n' "$lines" "$bangs" "${pages:-无PDF}" "$b"
          done | sort -k2,2nr | head -12

          echo
          SMALL="$(ls -S "$LATEX"/*.tex 2>/dev/null | tail -1)"
          SMB="$(basename "${SMALL%.tex}")"
          echo "=== ③ 拿最小册「$SMB」当样本 ==="
          echo "--- $SMB.tex 头 25 行 ---"
          head -25 "$SMALL"
          echo "--- $SMB.tex 尾 15 行 ---"
          tail -15 "$SMALL"
          echo "--- $SMB.log 尾 70 行（xelatex 自己最后说的话）---"
          tail -70 "$LATEX/$SMB.log"
          echo "--- $SMB.log 里 '! ' / 'No pages' / 半行截断线索 ---"
          grep -nE '^! |^l\.[0-9]+|No pages of output|Fatal error|Emergency stop|Missing character' "$LATEX/$SMB.log" | head -20
          echo "--- latexmk 转录 pdf-build-parts/$SMB.log 头 50 行 ---"
          head -50 "$ROOT/pdf-build-parts/$SMB.log" 2>/dev/null || echo "(没有转录文件)"
          echo "--- 同上 尾 80 行（latexmk 的结论）---"
          tail -80 "$ROOT/pdf-build-parts/$SMB.log" 2>/dev/null || true

          echo
          echo "=== ④ 手工复跑 xelatex（不经 latexmk；只看它自己的退出码与真话）==="
          cd "$LATEX" || exit 0
          export PATH="$ROOT/venv/bin:$PATH"
          echo "python: $(command -v python)  $(python -V 2>&1)"
          echo "makeindex-fix.py: $(ls -la makeindex-fix.py 2>/dev/null || echo 缺失)"
          echo "python.ist: $(ls -la python.ist 2>/dev/null || echo 缺失)"
          timeout 900 xelatex -interaction=nonstopmode -file-line-error "$SMB.tex" > /tmp/manual.out 2>&1
          echo "xelatex 退出码 = $?"
          grep -nE '^! |^l\.[0-9]+|Fatal|Emergency|No pages of output' /tmp/manual.out | head -20
          echo "--- 末 50 行 ---"
          tail -50 /tmp/manual.out
          echo "--- 这次手工跑的 PDF ---"
          pdfinfo "$SMB.pdf" 2>/dev/null | grep -E 'Pages|File size'

          echo
          echo "=== ⑤ 手工复跑 latexmk（原封不动照抄流水线的命令，看它返回什么）==="
          timeout 900 latexmk -pdf -gg -file-line-error -r latexmkrc \
            -e '$makeindex = q{python makeindex-fix.py %O -s python.ist -o %D %S};' \
            "$SMB.tex" > /tmp/manual2.out 2>&1
          echo "latexmk 退出码 = $?"
          echo "--- 末 60 行 ---"
          tail -60 /tmp/manual2.out
          echo "--- 这次 latexmk 的 PDF / 索引 ---"
          pdfinfo "$SMB.pdf" 2>/dev/null | grep -E 'Pages|File size'
          ls -la "$SMB.ind" 2>/dev/null || echo "  （没有 $SMB.ind）"

      - name: 失败诊断（把关键日志打出来，省得点进每一步翻）
        if: failure()
        run: |
          echo "=== 环境 ==="
          python -V || true
          uname -a || true
          echo "=== 构建根 ==="
          ls -la "$RUNNER_TEMP/build" 2>/dev/null || echo "(构建根不存在：说明步骤 1 之前就失败了)"
          echo "=== 关键日志（各末 60 行）==="
          for f in "$RUNNER_TEMP"/build/*/pip.log \
                   "$RUNNER_TEMP"/build/*/clone.log \
                   "$RUNNER_TEMP"/build/*/latex-build.log \
                   "$RUNNER_TEMP"/build/*/gui-build.log; do
            [ -f "$f" ] || continue
            echo "----- $f -----"
            tail -60 "$f"
          done
          echo "=== 每册 TeX 日志里的真错误（build/latex/<册>.log，这才是 xelatex 的原话）==="
          # ★ 上一轮踩过：只 grep pdf-build-*.log（latexmk 的标准输出）什么也找不到，
          #   真正的 `! ...` 在 TeX 自己写的 <册>.log 里。
          found=0
          for f in "$RUNNER_TEMP"/build/*/cpython/Doc/build/latex/*.log; do
            [ -f "$f" ] || continue
            errs="$(grep -nE '^! |^l\.[0-9]+ |Font .* does not|not a native platform' "$f" 2>/dev/null | head -8 || true)"
            if [ -z "$errs" ]; then
              continue
            fi
            found=$((found+1))
            echo "----- $(basename "$f") -----"
            echo "$errs"
            if [ "$found" -ge 3 ]; then
              echo "(只列前 3 册，其余同理)"
              break
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "(没有 ! 错误 —— 说明 xelatex 自己没报错，问题在 latexmk 调用层，看下面的 latexmkrc)"
          fi
          echo "=== 索引与 makeindex ==="
          echo "makeindex: $(command -v makeindex || echo MISSING)"
          ls "$RUNNER_TEMP"/build/*/cpython/Doc/build/latex/*.ind 2>/dev/null | wc -l | sed 's/^/  .ind 数量: /'
          LATEXDIR="$(find "$RUNNER_TEMP/build" -maxdepth 4 -type d -name latex | head -1)"
          if [ -n "$LATEXDIR" ]; then
            echo "  latex 目录: $LATEXDIR"
            [ -f "$LATEXDIR/makeindex-fix.py" ] && echo "  makeindex-fix.py 存在" || echo "  makeindex-fix.py 缺失"
            [ -f "$LATEXDIR/latexmkrc" ] && { echo "  --- latexmkrc ---"; cat "$LATEXDIR/latexmkrc"; }
            echo "  --- 一册 log 的头 30 行 ---"
            head -30 "$(ls "$LATEXDIR"/*.log 2>/dev/null | head -1)" 2>/dev/null || true
          fi
          echo "=== 每册 latexmk 输出里的错误（pdf-build-*.log）==="
          found2=0
          for f in "$RUNNER_TEMP"/build/*/pdf-build-*.log; do
            [ -f "$f" ] || continue
            errs="$(grep -nE '^! |Font .* does not exist|! Package .* Error|gave return code' "$f" 2>/dev/null | head -6 || true)"
            if [ -z "$errs" ]; then
              continue
            fi
            found2=$((found2+1))
            echo "----- $(basename "$f") -----"
            echo "$errs"
            echo "  … 该册末 20 行："
            tail -20 "$f" || true
            if [ "$found2" -ge 3 ]; then
              echo "(只列前 3 册)"
              break
            fi
          done
          echo "=== 字体自查 ==="
          for f in "FreeSerif" "FreeSans" "FreeMono" "Noto Serif CJK SC" "Noto Sans CJK SC"; do
            n="$(fc-list "$f" 2>/dev/null | wc -l || true)"
            printf '%-20s %s\n' "$f" "$n"
          done
          echo "=== 目录（2 层）==="
          find "$RUNNER_TEMP/build" -maxdepth 2 -type d 2>/dev/null | head -40 || true

      - name: 上传产物（artifact，保留 7 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.version }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/build/Python * PDF 文档 */*.pdf
            ${{ runner.temp }}/build/Python * PDF 文档 */验收报告.md
            ${{ runner.temp }}/build/Python * PDF 文档 */*.log

      # ★ 失败时把「显微镜」的证据推到 ci-logs 分支。
      #   为什么非要多这一步：runner 上的日志要拿 token 才能读（公开仓库也一样），
      #   而 raw.githubusercontent.com 谁都能读 —— 把证据落进一个孤儿分支，排错时
      #   一条 curl 就能拿到原文，不用截图、不用登录。
      #   体积控制：每份只留尾部 40 KB（TeX 日志动辄几 MB × 39 册会超仓库限制）。
      - name: 把诊断日志推到 ci-logs 分支（不登录也能读）
        if: failure()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          STAGE="$RUNNER_TEMP/cilogs"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          ROOT="$(find "$RUNNER_TEMP/build" -maxdepth 1 -type d -name 'Python * PDF 文档 *' | sort | tail -1)"
          LATEX="$ROOT/cpython/Doc/build/latex"
          cp "$RUNNER_TEMP/probe.txt" "$STAGE/probe.txt" 2>/dev/null || echo "(没有 probe.txt)" > "$STAGE/probe.txt"
          for f in "$LATEX"/*.log; do
            [ -f "$f" ] || continue
            tail -c 40000 "$f" > "$STAGE/texlog-$(basename "$f")" 2>/dev/null || true
          done
          for f in "$ROOT"/pdf-build-parts/*.log; do
            [ -f "$f" ] || continue
            tail -c 40000 "$f" > "$STAGE/latexmk-$(basename "$f")" 2>/dev/null || true
          done
          [ -f "$ROOT/gui-build.log" ] && tail -c 300000 "$ROOT/gui-build.log" > "$STAGE/gui-build-tail.log"
          [ -f "$ROOT/latex-build.log" ] && tail -c 300000 "$ROOT/latex-build.log" > "$STAGE/latex-build-tail.log"
          SMALL="$(ls -S "$LATEX"/*.tex 2>/dev/null | tail -1)"
          if [ -n "${SMALL:-}" ]; then
            { echo "=== $(basename "$SMALL")：$(wc -c <"$SMALL") 字节 / $(wc -l <"$SMALL") 行 ==="
              head -80 "$SMALL"; echo "……（中间略）……"; tail -40 "$SMALL"; } > "$STAGE/tex-sample.txt"
          fi
          echo "--- 打包清单 ---"; ls "$STAGE" | head -50; du -sh "$STAGE" || true
          # ★ 留一份说明：失败时这个分支会被整体覆盖成当次诊断，若不写 README，
          #   点进来的人只看到一堆 .log，不知道这是什么、也不知道每次都会被冲掉。
          cat > "$STAGE/README.md" <<'RMEOF'
          # ci-logs —— 构建失败时的诊断证据

          本分支**只在构建失败时**被写入，每次**整体覆盖**（CI 里是 `git init` +
          `git push --force`），所以永远只有最近一次的诊断，不会越堆越大。
          平时为空是正常的。这个分支不是代码，删掉不影响任何东西。

          | 文件 | 内容 |
          |-|-|
          | `probe.txt` | 「🔬 显微镜」探针的完整输出 |
          | `texlog-<册>.log` | 每册 LaTeX 日志的**尾部 40 KB** |
          | `latexmk-pdf-build-<册>.log` | latexmk 自己的转录 —— **真话在这里** |
          | `latex-build.log` / `gui-build.log` | 主程序日志尾部 300 KB |
          | `tex-sample.txt` | 最小那册 .tex 的头 80 行 + 尾 40 行 |

          读法：

          ```bash
          git fetch origin ci-logs && git show origin/ci-logs:probe.txt
          ```
          RMEOF
          cd "$STAGE" || exit 0
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "ci 诊断：run ${{ github.run_id }} / ${{ matrix.version }}" || true
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs \
            && echo "✔ 已推到 ci-logs 分支" || echo "✘ 推 ci-logs 失败（不影响其它步骤）"

      - name: 发布到 Releases（同版本原地更新；旧补丁版归档到 old 分支）
        if: success() && github.event.inputs.push_branch != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="${{ steps.build.outputs.root }}"
          [ -d "$ROOT" ] || { echo "找不到构建根"; exit 1; }

          # 版本号与日期都从**构建根名字**里取，保证和产物、tag、标题三处永远一致
          BNAME="$(basename "$ROOT")"                     # Python 3.15.2 PDF 文档 20261102
          FULL="$(sed -E 's/^Python ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/' <<<"$BNAME")"
          DATE="$(sed -E 's/.* ([0-9]{8})$/\1/' <<<"$BNAME")"
          MINOR="${FULL%.*}"
          TAG="v$FULL"                                    # 不带日期 → 一条线只有一个 release
          TITLE="Python $FULL 文档（$DATE）"
          # ---------- 1) 摆一个「ASCII 名」的暂存目录 ----------
          # ★ 2026-11-03 起的发布模型：Release 里**只放两样**
          #     · 合并册 PDF（英文名）
          #     · 打包了全部分册（中文原名）+ 验收报告的 RAR
          #   为什么：GitHub 附件名只接受 ASCII，39 个分册名全被服务端改成点号
          #   （`01Python 3.15 有什么新变化.pdf` → `01Python.3.15.pdf`），
          #   既要维护一张映射表、又占 40+ 个附件位。单册改为「从 RAR 里取」后，
          #   附件固定 2 个、名字永远正确、不用同步映射表。
          STAGE="$RUNNER_TEMP/assets-$FULL"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          EXP=()                                  # 期望出现在 release 里的附件名
          shopt -s nullglob

          # 合并册 = 根目录里**没有册号前缀**的那一个（分册都是 `01…` `0901…`）
          MERGED=()
          ALLPDF=("$ROOT"/*.pdf)
          for f in "${ALLPDF[@]}"; do
            base="$(basename "$f" .pdf)"
            # ★ 不要写成 `[[ ... ]] && continue`：条件为假时整条列表退出码是 1，
            #   在 `set -e` 下会直接终止整个发布步骤（实测非常隐蔽）。
            if [[ "$base" =~ ^[0-9] ]]; then continue; fi
            MERGED+=( "$f" )
          done
          NB=${#ALLPDF[@]}
          if [ "${#MERGED[@]}" -eq 0 ] && [ "${{ github.event.inputs.merge }}" = "false" ]; then
            echo "本次 --no-merge，没有合并册 → 跳过发布（分册仍在 artifact 里）"
            exit 0
          fi
          [ "${#MERGED[@]}" -eq 1 ] || {
            echo "::error::合并册应当恰好 1 个，实际 ${#MERGED[@]} 个：$(printf '%s ' "${MERGED[@]##*/}")"
            echo "         → 检查步骤 9 是否真的产出了合并册（或手动触发时 merge 被设成 false）"
            exit 1
          }
          PDF_NAME="Python-$FULL-docs-$DATE.pdf"
          cp -f "${MERGED[0]}" "$STAGE/$PDF_NAME"
          EXP+=( "$PDF_NAME" )
          echo "合并册：$PDF_NAME（构建根共 $NB 个 PDF，其中分册 $((NB - 1)) 个）"

          # ---------- 2) 压缩包（包内用中文原名；单册只能从这里取） ----------
          # ★ 压缩包现在是**唯一**能拿到单册的入口，所以它缺席 = 发布残缺。
          #   以前是「失败就只发单个 PDF」，现在直接报错不发布（artifact 里还留着全部分册）。
          ARCFILES=()
          for f in "${ALLPDF[@]}"; do ARCFILES+=( "$(basename "$f")" ); done
          if [ -f "$ROOT/验收报告.md" ]; then ARCFILES+=( "验收报告.md" ); fi
          ARCH=""
          if command -v rar >/dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/pack.rar"
            # 在构建根里按**纯文件名**打包，包里是中文名，不写绝对路径
            if ( cd "$ROOT" && rar a -m1 -idq "$RUNNER_TEMP/pack.rar" "${ARCFILES[@]}" ); then
              ARCH="Python-$FULL-docs-$DATE.rar"
              cp -f "$RUNNER_TEMP/pack.rar" "$STAGE/$ARCH"
            else
              echo "::warning::rar 打包失败，改用 zip"
            fi
          fi
          if [ -z "$ARCH" ] && command -v zip >/dev/null 2>&1; then
            rm -f "$RUNNER_TEMP/pack.zip"
            if ( cd "$ROOT" && zip -q -r "$RUNNER_TEMP/pack.zip" "${ARCFILES[@]}" ); then
              ARCH="Python-$FULL-docs-$DATE.zip"
              cp -f "$RUNNER_TEMP/pack.zip" "$STAGE/$ARCH"
            else
              echo "::warning::zip 打包也失败"
            fi
          fi
          if [ -z "$ARCH" ]; then
            echo "::error::rar 和 zip 都没打出包 —— 单册将无处可取，本次不发布"
            echo "         （全部分册仍在 artifact 里，7 天内可下载）"
            exit 1
          fi
          EXP+=( "$ARCH" )
          echo "压缩包：$ARCH（$(du -h "$STAGE/$ARCH" | cut -f1)，内含 $NB 个 PDF + 报告的中文原名）"

          # 上传前先自检：期望的附件都得真的存在（否则后面「清旧附件」会误伤）
          for a in "${EXP[@]}"; do
            [ -f "$STAGE/$a" ] || { echo "::error::暂存目录里没有 $a"; exit 1; }
          done

          # ---------- 3) 归档旧补丁版到 old 分支 ----------
          # 触发条件：同一条线（v3.15.*）里存在**别的** tag —— 说明补丁版本变了。
          MINOR_RE="${MINOR//./\\.}"
          STALE=()
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            [ "$t" = "$TAG" ] && continue
            STALE+=( "$t" )
          done < <(gh release list --limit 300 --json tagName --jq '.[].tagName' \
                     | grep -E "^v${MINOR_RE}\.[0-9]+$" || true)

          if [ "${#STALE[@]}" -gt 0 ]; then
            echo "发现旧补丁版：${STALE[*]} → 归档到 old 分支后删除对应 release"
            W="$RUNNER_TEMP/oldrepo"
            rm -rf "$W"
            if ! git clone -q --depth 1 --branch old \
                 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$W" 2>/dev/null; then
              mkdir -p "$W"; git -C "$W" init -q; git -C "$W" checkout -q -b old
            fi
            git -C "$W" config user.name  "github-actions[bot]"
            git -C "$W" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            GOT=()
            for t in "${STALE[@]}"; do
              D="$RUNNER_TEMP/old-$t"; rm -rf "$D"; mkdir -p "$D"
              if gh release download "$t" -R "$GITHUB_REPOSITORY" --dir "$D" --clobber \
                 && [ -n "$(ls -A "$D" 2>/dev/null)" ]; then
                mkdir -p "$W/$t"; cp -f "$D"/* "$W/$t"/
                GOT+=( "$t" )
                echo "  已下载 $t（$(du -sh "$D" | cut -f1)）"
              else
                echo "  ::warning::$t 下载失败或没有附件，保留它的 release 不删"
              fi
            done

            if [ "${#GOT[@]}" -gt 0 ]; then
              git -C "$W" add -A
              git -C "$W" commit -q -m "old: 归档 ${GOT[*]}（$(date -u '+%Y-%m-%d %H:%M') UTC）" || true
              PUSHED=0
              for i in 1 2 3; do
                if git -C "$W" push -q \
                     "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                     HEAD:refs/heads/old; then PUSHED=1; break; fi
                echo "  old 分支推送冲突，第 $i 次重试"
                git -C "$W" pull -q --rebase --autostash \
                  "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" old || true
                sleep 5
              done
              if [ "$PUSHED" -eq 1 ]; then
                for t in "${GOT[@]}"; do
                  gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag \
                    && echo "  已删除旧 release $t（内容在 old 分支 $t/ 下）"
                done
              else
                echo "::error::old 分支推送失败，旧 release 先留着（下轮再归档）"
              fi
            fi
          fi

          # ---------- 4) 生成发布说明 ----------
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "**Python $FULL 中文文档 · 构建日期 $DATE**"
            echo
            if [ -f "$ROOT/验收报告.md" ]; then
              grep '^- ' "$ROOT/验收报告.md" | sed -n '2,8p'
            fi
            echo "- 合并册：**$PDF_NAME**（单本，直接下载即看）"
            echo "- 全部分册（$((NB - 1)) 册）+ 合并册 + 验收报告：**$ARCH**（约 $(du -h "$STAGE/$ARCH" | cut -f1)）"
            echo
            # ★ 短版本（3.10.22 → 3.10）：分册文件名里用的是小版本号，别写死 3.15
            MV="${FULL%.*}"
            echo "**只要某一册？** 下载压缩包解压即可 —— 包里是 \`01Python $MV 有什么新变化.pdf\`"
            echo "这样的**中文原名**。Release 不再逐个挂分册：GitHub 的附件名只接受 ASCII，"
            echo "中文会被服务端替换成 \`.\`（\`01Python.$MV.pdf\`），挂上去反而认不出是哪一册。"
            echo
            echo "> 同一版本重跑会**原地更新**本 release（同名附件自动替换），不会一天一个。"
            echo "> 补丁版本升级时，旧版本会整体归档到 [\`old\`](../../tree/old) 分支再删除其 release。"
            echo "> **页面底部的 \`Source code (zip/tar.gz)\` 与本项目产物无关** —— 那是 GitHub"
            echo "> 按 tag 自动生成的仓库源码归档，**无法删除**（不是本 release 的附件）；"
            echo "> 下载中文 PDF 请只用上面那两个文件。"
          } > "$NOTES"

          # ---------- 5) 建或改 release ----------
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在 → 原地更新"
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            echo "release $TAG 不存在 → 新建"
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES"
          fi

          # ---------- 6) 先清掉「不在本轮名单里」的旧附件，再上传 ----------
          # ★ 顺序很关键：**先清后传**。
          #   上一版是「先传后清」，判据拿本地名（中文）跟服务端名（ASCII 化）比，
          #   一个都匹配不上 → 把刚传上去的 41 个附件（含 RAR）当「过期」全删了，
          #   而删除也返回 0，步骤还报绿。先清后传则最坏情况只是短暂空，随即被填满。
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | while IFS= read -r a; do
            [ -n "$a" ] || continue
            if ! printf '%s\n' "${EXP[@]}" | grep -Fxq -- "$a"; then
              gh release delete-asset "$TAG" "$a" --yes && echo "  清掉旧附件：$a"
            fi
          done

          # ---------- 7) 上传（--clobber：同名直接覆盖 = 原地更新） ----------
          gh release upload "$TAG" --clobber "$STAGE"/*

          # ---------- 8) 核对：附件必须**恰好**是「合并册 + 压缩包」 ----------
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/actual.txt"
          mapfile -t ACTUAL < "$RUNNER_TEMP/actual.txt" || true
          ACT=${#ACTUAL[@]}
          MISSING=(); EXTRA=()
          for a in "${EXP[@]}"; do
            printf '%s\n' "${ACTUAL[@]}" | grep -Fxq -- "$a" || MISSING+=( "$a" )
          done
          # ★ 「多了」也要报：老 release 有 40+ 个分册附件，清理逻辑一旦漏一个，
          #   下载页就又变回一堆点号名 —— 这正是「精简」要防的回归。
          for a in "${ACTUAL[@]}"; do
            [ -n "$a" ] || continue
            printf '%s\n' "${EXP[@]}" | grep -Fxq -- "$a" || EXTRA+=( "$a" )
          done
          echo "本次附件：$ACT 个（期望 ${#EXP[@]} 个：合并册 PDF + 全部册压缩包）"
          { cat "$NOTES"
            echo
            echo "- 附件：**$ACT** 个（合并册 PDF + 全部分册压缩包）"
          } > "$NOTES.final"
          gh release edit "$TAG" --notes-file "$NOTES.final"
          if [ "${#MISSING[@]}" -gt 0 ] || [ "${#EXTRA[@]}" -gt 0 ]; then
            echo "::error::附件核对不通过 —— 缺：${MISSING[*]:-无}；多余：${EXTRA[*]:-无}"
            printf '  实际附件：%s\n' "${ACTUAL[@]}"
            exit 1
          fi

          echo "✔ https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      # ★ 产出这张表要的数据：小版本号 / 拉取 .po 的时刻 / 译文分支最后提交时间。
      #   交给 summary job 汇总写回 README（本 job 只负责产出，不碰 README ——
      #   五个版本并发改同一个文件必然打架）。
      - name: 生成构建信息（供 summary 更新 README 表格）
        if: success()
        run: |
          set -uo pipefail
          ROOT="${{ steps.build.outputs.root }}"
          [ -n "$ROOT" ] && [ -d "$ROOT" ] || {
            echo "::warning::拿不到构建根，跳过"; exit 0; }
          FULL="$(basename "$ROOT" | sed -E 's/^Python ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/')"
          MV="${FULL%.*}"
          # ① PDF 构建时间 = 拉取 .po 的时刻：步骤 3 把 .po 铺进 Doc/locales，
          #    所以那些文件的 mtime 就是 Po 被拉下来的时间（不是开始构建、也不是上传时间）
          PO_T="—"
          POF="$(find "$ROOT/cpython/Doc/locales" -name '*.po' -print -quit 2>/dev/null || true)"
          if [ -n "$POF" ]; then
            PO_T="$(TZ=Asia/Shanghai date -r "$POF" '+%Y-%m-%d %H:%M')"
          fi
          # ② 译文最后更新 = python-docs-zh-cn 对应分支的最后一次提交
          ZH_T="—"
          if [ -d "$ROOT/zh-cn/.git" ]; then
            ISO="$(git -C "$ROOT/zh-cn" log -1 --format=%cI 2>/dev/null || true)"
            [ -n "$ISO" ] && ZH_T="$(TZ=Asia/Shanghai date -d "$ISO" '+%Y-%m-%d %H:%M')"
          fi
          printf '{"version":"%s","full":"%s","po":"%s","zh":"%s"}\n' \
            "$MV" "$FULL" "$PO_T" "$ZH_T" \
            | tee "$RUNNER_TEMP/build-info-${{ matrix.version }}.json"

      - name: 上传构建信息
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ matrix.version }}
          path: ${{ runner.temp }}/build-info-${{ matrix.version }}.json
          retention-days: 7
          if-no-files-found: warn

      - name: 汇总
        if: always()
        run: |
          echo "### Python ${{ matrix.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ROOT="${{ steps.build.outputs.root }}"
          if [ -n "$ROOT" ] && [ -f "$ROOT/验收报告.md" ]; then
            sed -n '/## 每步耗时/,$p' "$ROOT/验收报告.md" | head -30 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有验收报告（构建可能提前失败，看上面的日志）" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------- 汇总 README
  # ★ 五个 build job 并发，谁都不该去改 README（同一文件必然打架）。
  #   这里在全部 build 结束后统一收口：下载各版本的 build-info，只替换
  #   README 里两个标记之间的表格（其余部分一个字不动）。
  summary:
    # 也依赖 prepare：要靠它的 matrix 算出「这轮应该有几个版本」
    needs: [prepare, build]
    # archive_only 时 build 被跳过，这里也就不必跑
    if: always() && github.event.inputs.archive_only != 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: 取回各版本的构建信息
        # 全部构建都失败时这里没有 artifact —— 那也不该让本 job 变红
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: build-info-*
          path: infos
          merge-multiple: true

      - name: 更新 README 表格
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -uo pipefail
          echo "拿到的 build-info："
          ls -1 infos 2>/dev/null || echo "  （没有）"
          # ★ 2026-11-04 的坑：每个 artifact 里的文件原本都叫 build-info.json，
          #   而下载用了 merge-multiple: true → 五个同名文件解压到同一目录、
          #   互相覆盖，最后只剩一个（只有 3.15 被写进表格）。
          #   现在文件名带版本号；这里再核一次数量，少了就明确报警。
          EXPECT="$(printf '%s' "$MATRIX" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)["version"]))')"
          GOT="$(ls -1 infos/*.json 2>/dev/null | wc -l)"
          echo "拿到 $GOT 个版本的数据，本轮应有 $EXPECT 个"
          if [ "$GOT" -lt "$EXPECT" ]; then
            echo "::warning::少了 $((EXPECT - GOT)) 个版本的数据 —— 检查 artifact 是否同名互相覆盖"
          fi
          python3 ci/linux/update_readme_table.py infos README.md

      - name: 提交并推送
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if git diff --quiet -- README.md; then echo "README 无变化"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -q -m "docs(readme): 更新各版本构建/译文时间（$(date -u '+%Y-%m-%d') UTC）"
          for i in 1 2 3; do
            if git push -q \
                 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                 HEAD:main; then echo "✔ README 已更新"; exit 0; fi
            echo "推送冲突，第 $i 次重试"
            git pull -q --rebase --autostash \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main || true
            sleep 3
          done
          echo "::warning::README 推送失败（下次构建会再试）"
