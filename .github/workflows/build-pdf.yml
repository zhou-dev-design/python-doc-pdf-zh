name: 构建 Python 中文文档 PDF

# 每天自动跑一次；也可以在 Actions 页面手动触发
on:
  schedule:
    - cron: "0 19 * * *"        # UTC 19:00 = 北京时间次日 03:00
  workflow_dispatch:
    inputs:
      versions:
        description: "要构建的版本，逗号分隔"
        default: "3.13,3.14,3.15"
      fresh:
        description: "true = 丢掉已克隆的源码/venv 从零重建（慢 3~5 分钟，但能治残留）"
        default: "false"

permissions:
  contents: write            # 要往仓库里推分支

concurrency:
  group: build-pdf
  cancel-in-progress: false

jobs:
  build:
    # ★ 自托管 Windows：这台机器已有 TeX Live 2025 + 三个解释器，零移植
    #   托管 runner 跑不了这套 Windows 专用代码（详见 CI-说明.md）
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 前置检查（python / 三个解释器 / TeX Live）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pyver = (& python -c "import sys;print('%d.%d'%sys.version_info[:2])").Trim()
          Write-Host "PATH 里的 python = $pyver"
          if ([version]$pyver -lt [version]"3.10") {
            throw "PATH 里的 python 太旧（$pyver）：本脚本要 3.10+，请把它放到 PATH 前面"
          }
          $cfg = Get-Content "ci\config-ci.json" -Raw | ConvertFrom-Json
          foreach ($p in $cfg.version_pythons.PSObject.Properties) {
            if (-not (Test-Path $p.Value)) { throw "配置里的解释器不存在：$($p.Value)（改 ci\config-ci.json）" }
            Write-Host ("  {0} → {1}" -f $p.Name, ((& $p.Value -V) -join " "))
          }
          $lmk = Join-Path $cfg.texlive_bin "latexmk.exe"
          if (-not (Test-Path $lmk)) { throw "找不到 $lmk（改 ci\config-ci.json 的 texlive_bin）" }
          Write-Host "✔ 工具链就绪（TeX Live = $($cfg.texlive_bin)）"

      - name: 构建三个版本，并按版本推到各自分支
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          $t0 = Get-Date                      # 只推这次新产出的文件
          $list = "${{ github.event.inputs.versions }}"
          if ([string]::IsNullOrWhiteSpace($list)) { $list = "3.13,3.14,3.15" }
          $fresh    = ("${{ github.event.inputs.fresh }}" -eq "true")
          $versions = @($list.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })

          $logDir = Join-Path $env:RUNNER_TEMP "ci-logs"
          New-Item -ItemType Directory -Force $logDir | Out-Null
          $items = @()

          # ---------- 1. 三个版本同时起跑 ----------
          foreach ($v in $versions) {
            $root = Join-Path $env:RUNNER_TEMP "pdf-$v"
            if ($fresh -and (Test-Path $root)) { Remove-Item -Recurse -Force $root }
            New-Item -ItemType Directory -Force $root | Out-Null
            $log = Join-Path $logDir "$v.log"
            $cliArgs = @(
              "sphinx-pdf\gui\pdf_builder_multi.py", "--cli", "--json-log",
              "--config", "ci\config-ci.json", "--version", $v,
              "--root", $root, "--merge"
            )
            Write-Host "启动 Python $v（构建根 $root，日志 $log）"
            $p = Start-Process -FilePath "python" -ArgumentList $cliArgs -PassThru -NoNewWindow `
                 -RedirectStandardOutput $log -RedirectStandardError "$log.err"
            $items += [pscustomobject]@{ Version = $v; Proc = $p; Root = $root; Log = $log }
          }

          # ---------- 2. 等它们跑完 ----------
          foreach ($it in $items) {
            $it.Proc.WaitForExit()
            Write-Host "`n===== Python $($it.Version) 退出码 $($it.Proc.ExitCode) ====="
            if (Test-Path $it.Log) { Get-Content $it.Log -Tail 30 }
          }

          # ---------- 3. 成功的推到 v<完整版本> 分支；失败的留到最后一起报 ----------
          $cfg     = Get-Content "ci\config-ci.json" -Raw | ConvertFrom-Json
          $remote  = "https://x-access-token:$($env:GITHUB_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
          $failed  = @()
          $pushed  = @()

          foreach ($it in $items) {
            $v = $it.Version
            if ($it.Proc.ExitCode -ne 0) { $failed += $v; continue }

            $py   = $cfg.version_pythons.$v
            $full = (& $py -c "import sys;print('%d.%d.%d'%sys.version_info[:3])").Trim()
            $branch = "v$full"

            # 只取这次跑出来的 PDF（构建根跨天复用，里面可能还躺着旧日期的）
            $pdfs = @(Get-ChildItem -Path $it.Root -Filter *.pdf -File |
                      Where-Object { $_.LastWriteTime -ge $t0 })
            if ($pdfs.Count -eq 0) { Write-Warning "Python $v 没有新产出 PDF"; $failed += $v; continue }

            # 用临时仓库做「孤儿提交」：不带任何历史，分支里只留这一份
            $stage = Join-Path $env:RUNNER_TEMP "stage-$full"
            if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
            New-Item -ItemType Directory -Force $stage | Out-Null
            $pdfs | Copy-Item -Destination $stage -Force
            $rpt = Join-Path $it.Root "验收报告.md"
            if (Test-Path $rpt) { Copy-Item $rpt $stage -Force }

            git -C $stage init -q
            git -C $stage config user.name  "github-actions[bot]"
            git -C $stage config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C $stage checkout -q -b $branch
            git -C $stage add -A
            $mb = [math]::Round((($pdfs | Measure-Object Length -Sum).Sum) / 1MB, 1)
            git -C $stage commit -q -m "build: Python $full  $($pdfs.Count) 个 PDF  ${mb} MB  $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            # --force：分支永远只有一个提交、只有最新日期的产物
            git -C $stage -c credential.helper= push -q --force $remote "HEAD:refs/heads/$branch"

            Write-Host "✔ Python $full → 分支 $branch（$($pdfs.Count) 个 PDF，$mb MB）"
            $pushed += $branch
          }

          Write-Host "`n本次推送成功：$($pushed -join '、')"
          if ($failed.Count -gt 0) {
            throw ("以下版本失败、没有推送：" + ($failed -join "、") + "（日志见上面的输出）")
          }
